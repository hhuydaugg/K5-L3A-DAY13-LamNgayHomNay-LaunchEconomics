# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 yêu cầu, 42 người mỗi nhóm; tổng 84 > 40.
#   c) 20 nhân viên mỗi nhóm: trần hiệu dụng < 1.000 < 1.251, không đạt chênh 5 điểm.
#   d) 6 depot mỗi nhóm: trần hiệu dụng < 300; chỉ 6 cụm mỗi nhóm, loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần 299 yêu cầu/người; DE = 6,96; 5.980 yêu cầu/nhóm, hiệu dụng 859,20.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng và 20 nhân viên dùng trợ lý cùng tuần trong cùng 6 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có nguy cơ nhân viên chia sẻ kinh nghiệm; giảm bằng truy cập theo tài khoản staff_id và ghi log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Chỉ số chính, ngưỡng dừng và ngày 2027-01-05 được ghi trước khi bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, cách chia theo nhân viên có đúng 20 cụm mỗi nhóm.
#
# Đánh đổi đã chấp nhận: 40 nhân viên, 20 cụm mỗi nhóm, không đủ power cho chênh 5 điểm (mức trần hiệu dụng 1.000 < 1.251); chấp nhận MDE 6 điểm, n=859 mỗi nhóm, với power khoảng 0,64 nếu tác động thật chỉ là 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% toàn mẫu (3,97% trong noi_dia + hang_nang); ngưỡng an toàn: chênh ít nhất 2 điểm so với đối chứng hoặc vượt trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"                      # một người có tên vai trò, không ghi "cả đội"
  scope: "Chỉ noi_dia và hang_nang tại 6 depot chạy thử; 40 nhân viên chia 20 đối chứng và 20 can thiệp; loại quoc_te và doi_tac theo A3"                      # loại yêu cầu nào, depot nào; dựa vào kết quả A3
  assignment:
    unit: "staff"                     # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên; mỗi bước ít nhất một tuần
  # Chỉ đo hiệu quả ở bước 0.50, tích lũy 299 yêu cầu/người ở cả hai nhóm; chờ đủ 7 ngày theo dõi.
  # Nếu chưa đủ mẫu vào ngày quyết định thì kết luận chưa đủ bằng chứng, không tự động mở rộng.
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96            # 1 nếu chia theo yêu cầu
    clusters_per_arm: 20         # để trống nếu chia theo yêu cầu
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy cùng tuần, phân tầng theo depot; bốc thăm seed 13 trước khi bắt đầu"
    spillover_risk: "Có nguy cơ chia sẻ câu trả lời; giới hạn truy cập theo staff_id và theo dõi log mở trợ lý"
    predeclared: "Chốt chỉ số, MDE 6 điểm, luật dừng, seed và ngày quyết định trước khi bắt đầu; chỉ phân tích hiệu quả khi đủ mẫu và đủ 7 ngày theo dõi"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày ở các yêu cầu đã đủ 7 ngày theo dõi của nhóm trợ lý cao hơn đối chứng ít nhất 2 điểm hoặc vượt trần tuyệt đối 6% TRONG 3 lần kiểm tra hằng ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; chuyển mọi yêu cầu sang nhân viên tự làm"                   # ai bấm, mất bao lâu, khách được phục vụ bằng gì
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Toàn bộ dữ liệu logix_requests.csv và logix_runs.csv là giả lập; mở lại 51/1.200 = 4,25%, trong phạm vi 39/982 = 3,97%"
    - "Giả định thiết kế: baseline 0,70; MDE 0,06; alpha 0,05; power 0,80; ICC 0,02"
    - "Cỡ mẫu theo giả định: 859 hiệu dụng/nhóm; 20 cụm/nhóm; 299 yêu cầu/người; DE 6,96; 5.980 yêu cầu thực/nhóm"
    - "Chi phí thời gian nhân viên từ các cột phut_xem_lai_simulated và phut_lam_lai_simulated; lương giả định 2.000 đ/phút"
    - "Ngưỡng vận hành đề xuất: an toàn chênh 2 điểm hoặc vượt 6%; chi phí 8.000 đ/việc; bỏ qua gợi ý 40%"         # liệt kê mọi con số giả lập đã dùng

