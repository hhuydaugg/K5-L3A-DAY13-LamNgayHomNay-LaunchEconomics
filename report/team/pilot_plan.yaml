#   d) 6 depot mỗi nhóm:
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm:
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng và 20 nhân viên dùng trợ lý cùng tuần trong cùng 6 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có nguy cơ nhân viên chia sẻ kinh nghiệm; giảm bằng truy cập theo tài khoản staff_id và ghi log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Chỉ số chính, ngưỡng dừng và ngày 2027-01-05 được ghi trước khi bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, cách chia theo nhân viên có đúng 20 cụm mỗi nhóm.
#
# Đánh đổi đã chấp nhận: 40 nhân viên, 20 cụm mỗi nhóm, không đủ power cho chênh 5 điểm (mức trần hiệu dụng 1.000 < 1.251); chấp nhận MDE 6 điểm, n=859 mỗi nhóm, với power khoảng 0,64 nếu tác động thật chỉ là 5 điểm.
